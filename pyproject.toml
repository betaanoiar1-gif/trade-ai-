[project]
name = "crypto-ai-trader"
version = "0.1.0"
description = "Crypto-only AI trader with deterministic analytics and realistic paper trading"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "httpx>=0.27", "pydantic>=2.7", "fastapi>=0.115", "uvicorn>=0.30", "streamlit>=1.38", "plotly>=5.24"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
