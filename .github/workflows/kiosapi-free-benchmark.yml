name: KiosAPI free model benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: Test documented free models
        env:
          KIOS_API_KEY: ${{ secrets.KIOS_API_KEY }}
          KIOSAPI_BASE_URL: https://router.kiosapi.com/v1/
        run: python scripts/kiosapi_free_model_benchmark.py
